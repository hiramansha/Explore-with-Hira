<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore with Hira</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Decorative Elements -->

    <div class="decor airplane-left">✈</div>

    <div class="decor heart-left">♡</div>

    <div class="decor cloud-left">☁</div>

    <div class="decor cloud-right">☁</div>

    <div class="decor bird-right">⌁</div>


    <!-- Hero Section -->

    <header class="hero">


        <div class="hero-title">

            <span class="explore-text">
                Explore
            </span>

            <span class="with-text">
                with
            </span>

            <span class="hira-text">
                Hira
            </span>

            <span class="globe">
                🌍
            </span>

        </div>


        <div class="underline">
            ─────────
        </div>


        <p class="tagline">
            Discover the world, one country at a time.
        </p>


        <div class="little-heart">
            ── ♥ ──
        </div>


    </header>



    <!-- Main -->

    <main>


        <!-- Search Area -->

        <div class="search-container">


            <div class="search-input-wrapper">

                <span class="location-icon">
                    📍
                </span>


                <input
                    type="text"
                    id="country-input"
                    placeholder="Enter country name"
                >

            </div>


            <button id="search-btn">

                <span class="search-icon">
                    🔍
                </span>

                Search

            </button>


        </div>



        <!-- Error Message -->

        <p id="error-message"></p>



        <!-- Country Result -->

        <div id="country-result"></div>


    </main>



    <script src="script.js"></script>


</body>

</html>
